<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="1" fill="#374151" fill-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.06); }
      }
      @keyframes flowLight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowReverse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4.5; fill-opacity: 0.7; }
        50% { r: 7; fill-opacity: 1; }
      }
      .bg-glow-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 220px 90px;
      }
      .bg-glow-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 750px 180px;
      }
      .circuit-line {
        stroke-dasharray: 10, 10;
        animation: flowLight 22s linear infinite;
      }
      .circuit-line-rev {
        stroke-dasharray: 8, 8;
        animation: flowReverse 18s linear infinite;
      }
      .pulse-dot-1 {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .pulse-dot-2 {
        animation: nodePulse 3.5s ease-in-out infinite 0.7s;
      }
      .pulse-dot-3 {
        animation: nodePulse 4s ease-in-out infinite 1.4s;
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base with Rounded Borders -->
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Background Grid -->
  <rect width="960" height="320" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Blobs in Background (Non-intrusive) -->
  <g opacity="0.4">
    <circle class="bg-glow-1" cx="200" cy="80" r="140" fill="#0284c7" filter="url(#glow)" />
    <circle class="bg-glow-2" cx="780" cy="200" r="160" fill="#6366f1" filter="url(#glow)" />
    <circle class="bg-glow-1" cx="500" cy="260" r="100" fill="#a855f7" filter="url(#glow)" />
  </g>

  <!-- Animated Relational Schema Circuit Lines & Relationship Connections -->
  <g opacity="0.35">
    <path class="circuit-line" d="M 60 70 L 260 70 L 340 100 L 580 100" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="circuit-line-rev" d="M 580 100 L 680 60 L 890 60" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="circuit-line" d="M 120 255 L 300 255 L 420 215 L 680 215" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <path class="circuit-line-rev" d="M 680 215 L 760 255 L 890 255" fill="none" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Connection Nodes -->
    <circle class="pulse-dot-1" cx="260" cy="70" r="5" fill="#38bdf8" />
    <circle class="pulse-dot-2" cx="580" cy="100" r="5" fill="#818cf8" />
    <circle class="pulse-dot-3" cx="680" cy="60" r="4.5" fill="#c084fc" />
    <circle class="pulse-dot-1" cx="420" cy="215" r="5" fill="#c084fc" />
    <circle class="pulse-dot-2" cx="680" cy="215" r="5" fill="#38bdf8" />
  </g>

  <!-- Foreground Badge / Header Pill -->
  <g transform="translate(60, 36)">
    <rect width="320" height="26" rx="13" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="13" r="5" fill="#10b981" />
    <circle cx="14" cy="13" r="8" fill="#10b981" fill-opacity="0.3" />
    <text x="28" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">RELATIONAL SCHEMA ECOSYSTEM 2026</text>
  </g>

  <!-- Foreground Title -->
  <text class="banner-title" x="60" y="106" font-size="32">
    Awesome <tspan fill="url(#primaryGlow)">Relational Data Modeling</tspan> &amp; Custom Schema
  </text>

  <!-- Foreground Subtitle / Tagline -->
  <text class="banner-sub" x="60" y="142" font-size="14.5">
    Enterprise SaaS • No-Code Databases • Linked Records • Self-Hosted Open-Source SQL Engines
  </text>

  <!-- Feature Pills / Highlights in Foreground -->
  <g transform="translate(60, 182)">
    <!-- Pill 1: No-Code DB -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">⚡ No-Code DB</text>
    </g>

    <!-- Pill 2: Linked Records -->
    <g transform="translate(147, 0)">
      <rect width="165" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#818cf8" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🔗 Linked Records</text>
    </g>

    <!-- Pill 3: PostgreSQL / MySQL -->
    <g transform="translate(324, 0)">
      <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🐘 PostgreSQL / MySQL</text>
    </g>

    <!-- Pill 4: REST / GraphQL -->
    <g transform="translate(516, 0)">
      <rect width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#34d399" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🔌 REST &amp; GraphQL</text>
    </g>

    <!-- Pill 5: Self-Hosted -->
    <g transform="translate(688, 0)">
      <rect width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#fbbf24" />
      <text class="tag-text" x="30" y="21" fill="#e2e8f0">🐳 Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Mini-Footer Bar inside Banner -->
  <g transform="translate(60, 260)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
      Covering Airtable • Salesforce Data Cloud • HubSpot • NocoDB • Directus • Teable • Baserow • Grist • Quickbase • Coda
    </text>
  </g>
</svg>
